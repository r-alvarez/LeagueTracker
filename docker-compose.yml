services:
  # The database a host run (dotnet run, appsettings.json's localhost
  # connection string) and a container run share. The named volume keeps the
  # cluster across `docker compose down`; the container name and volume name
  # are fixed so the host-run recipe in the README finds the same instance.
  postgres:
    image: postgres:18-alpine
    container_name: leaguetracker-postgres
    environment:
      POSTGRES_DB: leaguetracker
      POSTGRES_USER: leaguetracker
      POSTGRES_PASSWORD: leaguetracker
    ports:
      - "5432:5432"
    volumes:
      - leaguetracker-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaguetracker -d leaguetracker"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One process, every tracked account (the three-container era is over; the
  # TrueNAS stack in deploy/truenas/compose.yml is the production shape).
  # ./data is the account folder of the configured account and the data root
  # in one, which is the layout a host run has used all along.
  leaguetracker:
    build: .
    container_name: leaguetracker
    ports:
      - "5170:5170"
    environment:
      # Match dates/CSV timestamps render in this zone; LP ledger stays UTC.
      - TZ=Europe/London
      - ConnectionStrings__LeagueTracker=Host=postgres;Database=leaguetracker;Username=leaguetracker;Password=leaguetracker
      - Accounts__DataRoot=/data
      - Accounts__List__0__GameName=ImRA
      - Accounts__List__0__TagLine=87166
      - Accounts__List__0__DataDir=/data
      - Riot__HideLp=false
    volumes:
      # Raw game files, replays, clips, LP ledger CSV, keys and
      # riot-api-key.txt (first line = the key). The SQLite files of earlier
      # builds are imported on the first boot and kept as *.imported.
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Reverse proxy so the app is reachable at http://leaguetracker.localhost
  # (no port). Browsers resolve *.localhost to loopback; a hosts entry makes it
  # bulletproof for non-browser clients too.
  proxy:
    image: caddy:2-alpine
    container_name: leaguetracker-proxy
    depends_on:
      - leaguetracker
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  leaguetracker-postgres:
    name: leaguetracker-postgres
