# TrueNAS deployment (Portainer repository stack).
# Traefik on the external `frontend` network is the only way in — no host
# ports. The render agent on the gaming PC reaches the tracker through the
# same hostnames (split-horizon DNS points them at the NAS on the LAN).
#
# GitOps: Portainer CE polls this repo (2m) and redeploys on any new commit -
# pushing to main IS the deploy; no manual "pull and redeploy" needed.

x-lt-build: &lt-build
  context: ../..
  dockerfile: Dockerfile

# What every tracker hands its agents (GET /api/agent/profile): the shared
# YouTube channel's OAuth client + refresh token, so no Google credential ever
# sits on a friend's PC, plus the recording defaults. YT_* are Portainer stack
# env vars, NEVER committed. Per-tracker overrides (a different title prefix,
# a private channel) go in that service's environment block. Builds published
# by deploy/publish-agent.ps1 land in the shared agent-releases folder; every
# agent updates itself from whichever tracker it talks to.
x-lt-agent-env: &lt-agent-env
  Agent__ReleaseDir: /agent-releases
  Agent__Profile__YouTubeUpload: "true"
  Agent__Profile__YouTubeVisibility: unlisted
  Agent__Profile__YouTubeClientId: ${YT_CLIENT_ID:-}
  Agent__Profile__YouTubeClientSecret: ${YT_CLIENT_SECRET:-}
  Agent__Profile__YouTubeRefreshToken: ${YT_REFRESH_TOKEN:-}
  Agent__Profile__RecordQueues: ranked-solo,normal
  Agent__Profile__UploadVodSidecars: "true"

services:
  leaguetracker:
    build: *lt-build
    pull_policy: build
    image: leaguetracker:local
    container_name: leaguetracker
    user: "568:568"
    environment:
      <<: *lt-agent-env
      TZ: Europe/London
      # Rank/LP display back on (2026-07-16), matching the local compose: the
      # process-first review views exist now, so rank reads as context, not
      # the verdict. Capture never stopped while it was hidden.
      Riot__HideLp: "false"
      Agent__Profile__RecordNamePrefix: Road to Platinum
      # This one mirrors GitHub agent releases into the shared folder
      # (writer); the other trackers mount it read-only.
      Agent__SyncReleases: "true"
    volumes:
      - /mnt/MediaPool/apps/leaguetracker/main:/data
      - /mnt/MediaPool/apps/leaguetracker/agent-releases:/agent-releases
    networks: [frontend]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.services.leaguetracker.loadbalancer.server.port=5170
      - traefik.http.routers.leaguetracker.rule=Host(`league.rjav-tech.co.uk`)
      - traefik.http.routers.leaguetracker.entrypoints=websecure
      - traefik.http.routers.leaguetracker.tls.certResolver=cloudflare
      - traefik.http.routers.leaguetracker.priority=100
      - traefik.http.routers.leaguetracker.service=leaguetracker

  leaguetracker-alt:
    build: *lt-build
    pull_policy: build
    image: leaguetracker:local
    container_name: leaguetracker-alt
    user: "568:568"
    environment:
      <<: *lt-agent-env
      TZ: Europe/London
      Riot__GameName: ImRA
      Riot__TagLine: "5957"
      Riot__HideLp: "false"
      Agent__Profile__RecordNamePrefix: Road to Platinum (alt)
    volumes:
      - /mnt/MediaPool/apps/leaguetracker/alt:/data
      - /mnt/MediaPool/apps/leaguetracker/agent-releases:/agent-releases:ro
    networks: [frontend]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.services.leaguetracker-alt.loadbalancer.server.port=5170
      - traefik.http.routers.leaguetracker-alt.rule=Host(`league-alt.rjav-tech.co.uk`)
      - traefik.http.routers.leaguetracker-alt.entrypoints=websecure
      - traefik.http.routers.leaguetracker-alt.tls.certResolver=cloudflare
      - traefik.http.routers.leaguetracker-alt.priority=100
      - traefik.http.routers.leaguetracker-alt.service=leaguetracker-alt

  leaguetracker-ben:
    build: *lt-build
    pull_policy: build
    image: leaguetracker:local
    container_name: leaguetracker-ben
    user: "568:568"
    environment:
      <<: *lt-agent-env
      TZ: Europe/London
      Riot__GameName: TheCosmicPeach
      Riot__TagLine: TTV
      Agent__Profile__RecordNamePrefix: Ben
    volumes:
      - /mnt/MediaPool/apps/leaguetracker/ben:/data
      - /mnt/MediaPool/apps/leaguetracker/agent-releases:/agent-releases:ro
    networks: [frontend]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.services.leaguetracker-ben.loadbalancer.server.port=5170
      - traefik.http.routers.leaguetracker-ben.rule=Host(`league-ben.rjav-tech.co.uk`)
      - traefik.http.routers.leaguetracker-ben.entrypoints=websecure
      - traefik.http.routers.leaguetracker-ben.tls.certResolver=cloudflare
      - traefik.http.routers.leaguetracker-ben.priority=100
      - traefik.http.routers.leaguetracker-ben.service=leaguetracker-ben

  # Adding a player = one more copy of this block: their Riot id, their own
  # /data folder, their own hostname (plus DNS + a Cloudflare Access app + a
  # service token for their agent - see docs/agent-handoff.md).
  # leaguetracker-vanessa:
  #   build: *lt-build
  #   pull_policy: build
  #   image: leaguetracker:local
  #   container_name: leaguetracker-vanessa
  #   user: "568:568"
  #   environment:
  #     <<: *lt-agent-env
  #     TZ: Europe/London
  #     Riot__GameName: <GameName>
  #     Riot__TagLine: <TagLine>
  #     Agent__Profile__RecordNamePrefix: Vanessa
  #   volumes:
  #     - /mnt/MediaPool/apps/leaguetracker/vanessa:/data
  #     - /mnt/MediaPool/apps/leaguetracker/agent-releases:/agent-releases:ro
  #   networks: [frontend]
  #   restart: unless-stopped
  #   labels:
  #     - traefik.enable=true
  #     - traefik.docker.network=frontend
  #     - traefik.http.services.leaguetracker-vanessa.loadbalancer.server.port=5170
  #     - traefik.http.routers.leaguetracker-vanessa.rule=Host(`league-vanessa.rjav-tech.co.uk`)
  #     - traefik.http.routers.leaguetracker-vanessa.entrypoints=websecure
  #     - traefik.http.routers.leaguetracker-vanessa.tls.certResolver=cloudflare
  #     - traefik.http.routers.leaguetracker-vanessa.priority=100
  #     - traefik.http.routers.leaguetracker-vanessa.service=leaguetracker-vanessa

  # Wakes the render PC while render work waits, so the gaming machine can
  # sleep instead of idling 24/7. The PC (10.10.10.x) and the NAS (10.10.40.x)
  # are on different subnets and routers drop directed broadcasts, so the
  # primary path asks the UniFi gateway to emit the magic packet inside the
  # PC's own VLAN. UNIFI_USER/UNIFI_PASS are set as Portainer stack env vars
  # (a local view-capable UniFi admin), NEVER committed here. Host networking
  # keeps the secondary raw broadcast possible and makes the tracker
  # hostnames resolve via split-horizon DNS - no Cloudflare Access token.
  waker:
    build:
      context: ./waker
    pull_policy: build
    image: leaguetracker-waker:local
    container_name: leaguetracker-waker
    user: "568:568"
    network_mode: host
    environment:
      - TZ=Europe/London
      - TRACKER_URLS=https://league.rjav-tech.co.uk,https://league-alt.rjav-tech.co.uk,https://league-ben.rjav-tech.co.uk
      - PC_MAC=D8-5E-D3-A2-58-4F
      - WOL_BROADCAST=10.10.10.255
      - POLL_SECONDS=60
      - UNIFI_URL=${UNIFI_URL:-https://10.10.40.1}
      - UNIFI_USER=${UNIFI_USER:-}
      - UNIFI_PASS=${UNIFI_PASS:-}
    restart: unless-stopped

networks:
  frontend:
    external: true
