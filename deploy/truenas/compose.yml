# TrueNAS deployment (Portainer repository stack).
# Traefik on the external `frontend` network is the only way in — no host
# ports. The render agent on the gaming PC reaches the tracker through the
# same hostnames (split-horizon DNS points them at the NAS on the LAN).
#
# GitOps: Portainer CE polls this repo (2m) and redeploys on any new commit -
# pushing to main IS the deploy; no manual "pull and redeploy" needed.

x-lt-build: &lt-build
  context: ../..
  dockerfile: Dockerfile

# What every tracker hands its agents (GET /api/agent/profile): the shared
# YouTube channel's OAuth client + refresh token, so no Google credential ever
# sits on a friend's PC, plus the recording defaults. YT_* are Portainer stack
# env vars, NEVER committed. Per-tracker overrides (a different title prefix,
# a private channel) go in that service's environment block. Builds published
# by deploy/publish-agent.ps1 land in the shared agent-releases folder; every
# agent updates itself from whichever tracker it talks to.
x-lt-agent-env: &lt-agent-env
  Agent__ReleaseDir: /agent-releases
  Agent__Profile__YouTubeUpload: "true"
  Agent__Profile__YouTubeVisibility: unlisted
  Agent__Profile__YouTubeClientId: ${YT_CLIENT_ID:-}
  Agent__Profile__YouTubeClientSecret: ${YT_CLIENT_SECRET:-}
  Agent__Profile__YouTubeRefreshToken: ${YT_REFRESH_TOKEN:-}
  Agent__Profile__RecordQueues: ranked-solo,normal
  # Friends publish to YouTube and send only the small review sidecar; the
  # full multi-GB video is NOT pushed to the NAS (YouTube hosts it). Without
  # this an agent defaults to UploadVods=true and tries to upload every game's
  # video over the wire - slow, and it fills the NAS.
  Agent__Profile__UploadVods: "false"
  Agent__Profile__UploadVodSidecars: "true"

services:
  # One process, every tracked account: /data is the parent of the per-account
  # folders (main/alt/ben - the three former containers' volumes, unmoved) plus
  # agent-releases. league.rjav-tech.co.uk/{region}/{RiotId}/... is the site;
  # the old per-account hostnames still route here (kept in the Traefik rule
  # and AllowedHosts so bookmarks land on the site, not on a 400) but bind to
  # nothing - the account is always in the path. Adding a player = the site's
  # "Add account" (or one more Accounts__List__N block: GameName, TagLine,
  # DataDir; DisplayName/HideLp/Region/Platform/Owner optional).
  # Built here from the checked-out commit. CI also publishes the same
  # Dockerfile as ghcr.io/r-alvarez/leaguetracker:<sha> (and :main, :latest)
  # on every green main - the immutable copy. To roll back to a known-good
  # build without waiting on a rebuild: comment out `build`/`pull_policy`,
  # set `image: ghcr.io/r-alvarez/leaguetracker:sha-<full sha>`, push; undo
  # when main is fixed. (Portainer needs "re-pull image" on for that path.)
  leaguetracker:
    build: *lt-build
    pull_policy: build
    image: leaguetracker:local
    container_name: leaguetracker
    user: "568:568"
    environment:
      <<: *lt-agent-env
      TZ: Europe/London
      Riot__ApiKeyFile: /data/main/riot-api-key.txt
      # Identity: the app is an OIDC client of Auth0 with its own users table
      # (registry.db under /data). Issuer, client id/secret are Portainer stack
      # env vars, NEVER committed. Admins and each account's owner are emails;
      # the user rows exist before anyone signs in and join on first login.
      Auth__Oidc__Authority: ${AUTH0_ISSUER:-}
      Auth__Oidc__ClientId: ${AUTH0_CLIENT_ID:-}
      Auth__Oidc__ClientSecret: ${AUTH0_CLIENT_SECRET:-}
      Auth__Admins: ${AUTH_ADMINS:-}
      # Cloudflare Access still walls the site: reads need a signed-in person
      # until the public launch flips this to "true".
      Auth__PublicReads: "false"
      # Rollout: approved agent keys from before ownership keep working on every
      # account until each is assigned an owner on the Data page; then "false".
      Agents__AllowUnbound: "true"
      AllowedHosts: league.rjav-tech.co.uk;league-alt.rjav-tech.co.uk;league-ben.rjav-tech.co.uk
      Accounts__DataRoot: /data
      Accounts__Default: ImRA-87166
      Accounts__List__0__GameName: ImRA
      Accounts__List__0__TagLine: "87166"
      Accounts__List__0__DataDir: /data/main
      Accounts__List__0__DisplayName: Ruben
      Accounts__List__0__Owner: ${OWNER_RUBEN:-}
      Accounts__List__1__GameName: ImRA
      Accounts__List__1__TagLine: "5957"
      Accounts__List__1__DataDir: /data/alt
      Accounts__List__1__DisplayName: Ruben (alt)
      Accounts__List__1__Owner: ${OWNER_RUBEN:-}
      Accounts__List__2__GameName: TheCosmicPeach
      Accounts__List__2__TagLine: TTV
      Accounts__List__2__DataDir: /data/ben
      Accounts__List__2__DisplayName: Ben
      Accounts__List__2__Owner: ${OWNER_BEN:-}
      # Accounts__List__3__GameName: <Vanessa's game name>
      # Accounts__List__3__TagLine: <tag>
      # Accounts__List__3__DataDir: /data/vanessa
      # Accounts__List__3__DisplayName: Vanessa
      Agent__ReleaseDir: /data/agent-releases
      Agent__SyncReleases: "true"
      Agent__Profile__RecordNamePrefix: Road to Platinum
    volumes:
      - /mnt/MediaPool/apps/leaguetracker:/data
    networks: [frontend]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.services.leaguetracker.loadbalancer.server.port=5170
      - traefik.http.routers.leaguetracker.rule=Host(`league.rjav-tech.co.uk`) || Host(`league-alt.rjav-tech.co.uk`) || Host(`league-ben.rjav-tech.co.uk`)
      - traefik.http.routers.leaguetracker.entrypoints=websecure
      - traefik.http.routers.leaguetracker.tls.certResolver=cloudflare
      - traefik.http.routers.leaguetracker.priority=100
      - traefik.http.routers.leaguetracker.service=leaguetracker

  # Wakes the render PC while render work waits, so the gaming machine can
  # sleep instead of idling 24/7. The PC (10.10.10.x) and the NAS (10.10.40.x)
  # are on different subnets and routers drop directed broadcasts, so the
  # primary path asks the UniFi gateway to emit the magic packet inside the
  # PC's own VLAN. UNIFI_USER/UNIFI_PASS are set as Portainer stack env vars
  # (a local view-capable UniFi admin), NEVER committed here. Host networking
  # keeps the secondary raw broadcast possible and makes the tracker
  # hostnames resolve via split-horizon DNS - no Cloudflare Access token.
  waker:
    build:
      context: ./waker
    pull_policy: build
    image: leaguetracker-waker:local
    container_name: leaguetracker-waker
    user: "568:568"
    network_mode: host
    environment:
      - TZ=Europe/London
      # One URL: /api/render/pending already counts every account.
      - TRACKER_URLS=https://league.rjav-tech.co.uk
      - PC_MAC=D8-5E-D3-A2-58-4F
      - WOL_BROADCAST=10.10.10.255
      - POLL_SECONDS=60
      - UNIFI_URL=${UNIFI_URL:-https://10.10.40.1}
      - UNIFI_USER=${UNIFI_USER:-}
      - UNIFI_PASS=${UNIFI_PASS:-}
    restart: unless-stopped

networks:
  frontend:
    external: true
