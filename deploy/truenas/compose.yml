# TrueNAS deployment (Portainer repository stack).
# Traefik on the external `frontend` network is the only way in — no host
# ports. The render agent on the gaming PC reaches the tracker through the
# same hostnames (split-horizon DNS points them at the NAS on the LAN).
#
# GitOps: Portainer CE polls this repo (2m) and redeploys on any new commit -
# pushing to main IS the deploy; no manual "pull and redeploy" needed.

x-lt-build: &lt-build
  context: ../..
  dockerfile: Dockerfile

# What every tracker hands its agents (GET /api/agent/profile): the shared
# YouTube channel's OAuth client + refresh token, so no Google credential ever
# sits on a friend's PC, plus the recording defaults. YT_* are Portainer stack
# env vars, NEVER committed. Per-tracker overrides (a different title prefix,
# a private channel) go in that service's environment block. Builds published
# by deploy/publish-agent.ps1 land in the shared agent-releases folder; every
# agent updates itself from whichever tracker it talks to.
x-lt-agent-env: &lt-agent-env
  Agent__ReleaseDir: /agent-releases
  Agent__Profile__YouTubeUpload: "true"
  Agent__Profile__YouTubeVisibility: unlisted
  Agent__Profile__YouTubeClientId: ${YT_CLIENT_ID:-}
  Agent__Profile__YouTubeClientSecret: ${YT_CLIENT_SECRET:-}
  Agent__Profile__YouTubeRefreshToken: ${YT_REFRESH_TOKEN:-}
  # Recordings leave the player's PC once safely on YouTube (processed +
  # linked here) - customers don't keep gigabytes they never look at. Ruben's
  # own agent keeps them for debugging: the per-agent override wins over the
  # shared value, and this is decided from here so a self-updating agent on a
  # machine nobody is sitting at never deletes anything by surprise.
  Agent__Profile__KeepRecordingsAfterPublish: "false"
  # Per-agent blocks are keyed by the KEY ID an admin sees on the Machines
  # page (the code beside the machine's name), never by the name the machine
  # chose at enrol - a name is anyone's to type. A block that names no key is
  # reported in the boot log. The ids: GET /api/admin/agents, keys[].id.
  Agent__Profiles__79f4badd6236__KeepRecordingsAfterPublish: "true"
  # Post-game review is off for a new install (it opens the replay on the
  # player's screen); the two machines whose owners asked for it get it here.
  Agent__Profiles__79f4badd6236__PostGameReview: "true"
  Agent__Profiles__60250018a226__PostGameReview: "true"
  # Ben's agent uploads through its own Google Cloud project (own 10k-unit
  # daily quota - videos.insert costs 1,600, so one project is ~6 uploads a
  # day for everyone together) but still to the same channel: the refresh
  # token was minted for that channel with project B's client. Blank = falls
  # back to the shared values above.
  Agent__Profiles__60250018a226__YouTubeClientId: ${YT_BEN_CLIENT_ID:-}
  Agent__Profiles__60250018a226__YouTubeClientSecret: ${YT_BEN_CLIENT_SECRET:-}
  Agent__Profiles__60250018a226__YouTubeRefreshToken: ${YT_BEN_REFRESH_TOKEN:-}
  Agent__Profile__RecordQueues: ranked-solo,normal
  # Friends publish to YouTube and send only the small review sidecar; the
  # full multi-GB video is NOT pushed to the NAS (YouTube hosts it). Without
  # this an agent defaults to UploadVods=true and tries to upload every game's
  # video over the wire - slow, and it fills the NAS.
  Agent__Profile__UploadVods: "false"
  Agent__Profile__UploadVodSidecars: "true"

services:
  # One process, every tracked account: /data is the parent of the per-account
  # folders (main/alt/ben - the three former containers' volumes, unmoved) plus
  # agent-releases. league.rjav-tech.co.uk/{region}/{RiotId}/... is the site;
  # the old per-account hostnames still route here (kept in the Traefik rule
  # and AllowedHosts so bookmarks land on the site, not on a 400) but bind to
  # nothing - the account is always in the path. Adding a player = the site's
  # "Add account" (or one more Accounts__List__N block: GameName, TagLine,
  # DataDir; DisplayName/HideLp/Region/Platform/Owner optional).
  # Built here from the checked-out commit. CI also publishes the same
  # Dockerfile as ghcr.io/r-alvarez/leaguetracker:<sha> (and :main, :latest)
  # on every green main - the immutable copy. To roll back to a known-good
  # build without waiting on a rebuild: comment out `build`/`pull_policy`,
  # set `image: ghcr.io/r-alvarez/leaguetracker:sha-<full sha>`, push; undo
  # when main is fixed. (Portainer needs "re-pull image" on for that path.)
  leaguetracker:
    build: *lt-build
    pull_policy: build
    image: leaguetracker:local
    container_name: leaguetracker
    user: "568:568"
    environment:
      <<: *lt-agent-env
      TZ: Europe/London
      Riot__ApiKeyFile: /data/main/riot-api-key.txt
      # The one database: the registry in its own schema, every account in its
      # own (acct_<id>). The password is a Portainer stack env var, NEVER
      # committed; the postgres service below reads the same one. The first
      # boot on this build brings each SQLite file (registry.db, every
      # <account>/leaguetracker.db) across, verifies it row for row and
      # renames it *.imported - see docs/operate.md.
      ConnectionStrings__LeagueTracker: Host=postgres;Database=leaguetracker;Username=leaguetracker;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is a stack env var}
      # Identity: the app is an OIDC client of Auth0 with its own users table
      # (the registry schema). Issuer, client id/secret are Portainer stack
      # env vars, NEVER committed. Admins and each account's owner are emails;
      # the user rows exist before anyone signs in and join on first login.
      Auth__Oidc__Authority: ${AUTH0_ISSUER:-}
      Auth__Oidc__ClientId: ${AUTH0_CLIENT_ID:-}
      Auth__Oidc__ClientSecret: ${AUTH0_CLIENT_SECRET:-}
      Auth__Admins: ${AUTH_ADMINS:-}
      # Invites: a separate Machine-to-Machine application authorised for the
      # Management API (create:users read:users delete:users
      # create:user_tickets). Unset = "Add a person" still makes the row here
      # but creates nothing at Auth0 and sends no mail.
      Auth__Management__ClientId: ${AUTH0_MGMT_CLIENT_ID:-}
      Auth__Management__ClientSecret: ${AUTH0_MGMT_CLIENT_SECRET:-}
      # Nobody signs in without a row here (invited, configured or already
      # known); "false" lets any identity the tenant accepts create one.
      Auth__InviteOnly: "true"
      # Cloudflare Access still walls the site: reads need a signed-in person
      # until the public launch flips this to "true".
      Auth__PublicReads: "false"
      # Every agent key belongs to a user; the pre-ownership grace period is
      # over. "true" only if a key ever has to work before it is assigned.
      Agents__AllowUnbound: "false"
      # Every request reaches this container from Traefik on the frontend
      # network, so the peer it sees is that network's gateway - never
      # Cloudflare's edge. CF-Connecting-IP (the real client: the Machines
      # page's FROM column, the per-address enrolment budget) is believed
      # from there as well as from Cloudflare's own ranges. The residual
      # trust is anything that can reach Traefik directly, i.e. the LAN.
      Proxy__ClientIpHeaderFrom__0: 172.20.0.1/32
      AllowedHosts: league.rjav-tech.co.uk;league-alt.rjav-tech.co.uk;league-ben.rjav-tech.co.uk
      Accounts__DataRoot: /data
      Accounts__Default: ImRA-87166
      Accounts__List__0__GameName: ImRA
      Accounts__List__0__TagLine: "87166"
      Accounts__List__0__DataDir: /data/main
      Accounts__List__0__DisplayName: Ruben
      Accounts__List__0__Owner: ${OWNER_RUBEN:-}
      Accounts__List__1__GameName: ImRA
      Accounts__List__1__TagLine: "5957"
      Accounts__List__1__DataDir: /data/alt
      Accounts__List__1__DisplayName: Ruben (alt)
      Accounts__List__1__Owner: ${OWNER_RUBEN:-}
      # A friend's Riot ID and name are theirs, not the public repo's: they
      # come from the stack environment like the owner emails. All three
      # unset = the entry is skipped (registry.db remembers the account from
      # the boot that had them); a partial entry is refused at boot.
      Accounts__List__2__GameName: ${ACCOUNT_2_GAMENAME:-}
      Accounts__List__2__TagLine: ${ACCOUNT_2_TAGLINE:-}
      Accounts__List__2__DataDir: /data/ben
      Accounts__List__2__DisplayName: ${ACCOUNT_2_DISPLAYNAME:-}
      Accounts__List__2__Owner: ${OWNER_BEN:-}
      # Accounts__List__3__GameName: ${ACCOUNT_3_GAMENAME:-}
      # Accounts__List__3__TagLine: ${ACCOUNT_3_TAGLINE:-}
      # Accounts__List__3__DataDir: /data/<folder>
      # Accounts__List__3__DisplayName: ${ACCOUNT_3_DISPLAYNAME:-}
      Agent__ReleaseDir: /data/agent-releases
      Agent__SyncReleases: "true"
      Agent__Profile__RecordNamePrefix: Road to Platinum
    volumes:
      - /mnt/MediaPool/apps/leaguetracker:/data
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.services.leaguetracker.loadbalancer.server.port=5170
      - traefik.http.routers.leaguetracker.rule=Host(`league.rjav-tech.co.uk`) || Host(`league-alt.rjav-tech.co.uk`) || Host(`league-ben.rjav-tech.co.uk`)
      - traefik.http.routers.leaguetracker.entrypoints=websecure
      - traefik.http.routers.leaguetracker.tls.certResolver=cloudflare
      - traefik.http.routers.leaguetracker.priority=100
      - traefik.http.routers.leaguetracker.service=leaguetracker

  # The database, on the same dataset as everything else so one ZFS snapshot
  # still holds the whole tracker. Starts as root to take ownership of its
  # folder on first run and drops to the image's postgres user - the official
  # image's own flow; running it as 568 needs an /etc/passwd entry and buys
  # nothing on a folder only it touches. PostgreSQL 18 images keep the cluster
  # under /var/lib/postgresql/18/docker; the parent is the documented volume
  # so a later major upgrade (pg_upgrade --link) has both versions in reach.
  postgres:
    image: postgres:18-alpine
    container_name: leaguetracker-postgres
    environment:
      TZ: Europe/London
      POSTGRES_DB: leaguetracker
      POSTGRES_USER: leaguetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is a stack env var}
    volumes:
      - /mnt/MediaPool/apps/leaguetracker/postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaguetracker -d leaguetracker"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # A nightly pg_dump into /data/backups (14 kept): the copy that restores on
  # any host with one pg_restore, next to the crash-consistent snapshot of the
  # cluster folder above.
  pg-backup:
    build:
      context: ./pg-backup
    pull_policy: build
    image: leaguetracker-pg-backup:local
    container_name: leaguetracker-pg-backup
    user: "568:568"
    environment:
      TZ: Europe/London
      PGHOST: postgres
      PGDATABASE: leaguetracker
      PGUSER: leaguetracker
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is a stack env var}
      BACKUP_DIR: /backups
      KEEP_DAYS: "14"
    volumes:
      - /mnt/MediaPool/apps/leaguetracker/backups:/backups
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Wakes the render PC while render work waits, so the gaming machine can
  # sleep instead of idling 24/7. The PC and the NAS are on different subnets
  # and routers drop directed broadcasts, so the primary path asks the UniFi
  # gateway to emit the magic packet inside the PC's own VLAN. Everything that
  # describes the network - PC_MAC, WOL_BROADCAST, UNIFI_URL and the UniFi
  # login (a local view-capable admin) - is a Portainer stack env var, NEVER
  # committed here: this repo is public. Host networking keeps the secondary
  # raw broadcast possible and makes the tracker hostnames resolve via
  # split-horizon DNS - no Cloudflare Access token.
  waker:
    build:
      context: ./waker
    pull_policy: build
    image: leaguetracker-waker:local
    container_name: leaguetracker-waker
    user: "568:568"
    network_mode: host
    environment:
      - TZ=Europe/London
      # One URL: /api/render/pending already counts every account.
      - TRACKER_URLS=https://league.rjav-tech.co.uk
      - PC_MAC=${PC_MAC:-}
      - WOL_BROADCAST=${WOL_BROADCAST:-255.255.255.255}
      - POLL_SECONDS=60
      - UNIFI_URL=${UNIFI_URL:-}
      - UNIFI_USER=${UNIFI_USER:-}
      - UNIFI_PASS=${UNIFI_PASS:-}
    restart: unless-stopped

networks:
  frontend:
    external: true
  # App <-> database only; nothing on it is reachable from outside the stack.
  backend:
    internal: true
