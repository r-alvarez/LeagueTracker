# Every push and pull request: does it all still build, and do the tests pass.
# Nothing here deploys - Portainer redeploys main on its own (deploy/truenas)
# and agent-release.yml publishes the agent - but a red run on main means the
# tracker is about to be rebuilt from a commit that doesn't compile, so fix it
# first. On main the image job also publishes the API image to GHCR: an
# immutable, scannable copy of exactly what main was, to roll back to.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LeagueTracker.slnx
      - run: dotnet build LeagueTracker.slnx -c Release --no-restore --nologo
      - run: dotnet test LeagueTracker.slnx -c Release --no-build --nologo --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/leaguetracker-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/leaguetracker-web/package-lock.json
      # Same as the Dockerfile: npm ci refuses the Windows-generated lockfile
      # (missing linux optional deps); install stays lockfile-driven.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build -- --outDir dist --emptyOutDir

  agent:
    name: Agent build (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/LeagueTracker.RenderAgent -c Release --nologo
      - run: dotnet build src/LeagueTracker.ReplayLauncher -c Release --nologo
      # The agent's own tests (upload pacing, profile parsing) - Windows-only
      # like the agent, so they live here rather than in the API test job.
      - run: dotnet test tests/LeagueTracker.RenderAgent.Tests -c Release --nologo --logger "trx;LogFileName=agent-results.trx"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agent-test-results
          path: '**/TestResults/agent-results.trx'
          retention-days: 7

  # The WGC engine the agent ships is our build of ScreenRecorderLib (upstream
  # at a pinned commit + the HDR tone-map patch, deploy/screenrecorderlib).
  # Built here so a patch that no longer applies or compiles fails the push
  # that broke it, not the release; the DLL is uploaded as an artifact and
  # agent-release.yml ships exactly that file. Cached on the inputs' hash, so
  # an unchanged patch costs a restore, not a build.
  #
  # windows-2022, not -latest: it is a v143 (VS 2022) C++/CLI project needing
  # ATL, and the -latest image (VS 2026) ships v143 without ATL headers.
  # Building with the 2026 toolset would also tie the DLL to a newer VC
  # runtime than the players' PCs are known to have.
  screenrecorderlib:
    name: ScreenRecorderLib (HDR tone-map)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deploy/screenrecorderlib/out
          key: screenrecorderlib-${{ hashFiles('deploy/screenrecorderlib/**') }}
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\deploy\screenrecorderlib\build.ps1
      - name: Record hash
        shell: pwsh
        run: |
          $dll = "deploy\screenrecorderlib\out\ScreenRecorderLib.dll"
          if (-not (Test-Path $dll)) { throw "no ScreenRecorderLib.dll produced" }
          "ScreenRecorderLib.dll sha256 $((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant())" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenrecorderlib
          path: |
            deploy/screenrecorderlib/out/ScreenRecorderLib.dll
            deploy/screenrecorderlib/out/ScreenRecorderLib.pdb
          if-no-files-found: error
          retention-days: 14

  image:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    # main publishes; pull requests prove the Dockerfile builds; other branches
    # already had their code checked above and don't need an image.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/leaguetracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      # Pull requests only prove the Dockerfile builds; pushes publish. Layer
      # cache lives in GitHub's cache so a docs-only push doesn't rebuild the
      # SDK layers.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # Vulnerability scan of the runtime image -> the repo's Security tab.
      # Informational for now (exit-code 0): the base image is Microsoft's and
      # patch cadence is theirs; this makes it visible, not blocking.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-image
