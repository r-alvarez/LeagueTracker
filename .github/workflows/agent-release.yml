# Builds the Windows agent whenever its code changes on main and publishes
# the zip as a GitHub Release (tag agent-<version>). The trackers on TrueNAS
# poll these releases (AgentReleaseSyncService) and drop the newest zip in
# the shared agent-releases folder, from which every agent updates itself -
# so a push to main is the whole agent deploy, the same as it is for the API.
name: agent-release

on:
  push:
    branches: [main]
    paths:
      - src/LeagueTracker.RenderAgent/**
      - src/LeagueTracker.ReplayLauncher/**
      - deploy/publish-agent.ps1
      - .github/workflows/agent-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # publish-agent.ps1 bundles ffmpeg from PATH so a friend's PC needs
      # nothing else installed. Not choco: its ffmpeg on PATH is a shim that
      # only works on the machine it was installed on. Gyan's full build is a
      # single static exe (NVENC included), same as the owner's machines use.
      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg-dist | Out-Null
          $bin = (Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "$bin" >> $env:GITHUB_PATH
          & (Join-Path $bin ffmpeg.exe) -version | Select-Object -First 1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build zip and installer
        id: build
        shell: pwsh
        run: |
          .\deploy\publish-agent.ps1
          $zip = Get-ChildItem src\LeagueTracker.RenderAgent\bin\LeagueTracker.RenderAgent-*.zip | Select-Object -First 1
          $version = $zip.BaseName -replace '^.*-', ''
          $setup = Get-ChildItem src\LeagueTracker.RenderAgent\bin\LeagueTracker.Agent-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "installer missing" }
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "agent-${{ steps.build.outputs.version }}" "${{ steps.build.outputs.zip }}" "${{ steps.build.outputs.setup }}" `
            --title "Agent ${{ steps.build.outputs.version }}" `
            --notes "Render/recorder agent build from ${{ github.sha }}. Setup.exe for new machines (per-user, no admin); the zip is what installed agents update themselves from."
