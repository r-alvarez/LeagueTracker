# Publishes the Windows agent as a GitHub Release (tag agent-<version>). The
# trackers on TrueNAS poll these releases (AgentReleaseSyncService) and drop
# the newest zip in the shared agent-releases folder, from which every agent
# updates itself - so a release here is the whole agent deploy.
#
# It runs when ci has gone green on main (workflow_run), builds the exact
# commit ci tested, and only releases when something agent-related changed
# since the last agent-* tag - a docs commit does not ship an agent, and a
# red ci never does. The WGC engine (our build of ScreenRecorderLib, HDR
# tone-map patch) is not rebuilt here: it is the artifact ci's
# screenrecorderlib job produced from that same commit, and the zip is
# refused if it does not contain exactly that file.
#
# Everything that goes into the zip is pinned: the actions by commit, ffmpeg
# by version and checksum, Inno Setup by version. The same commit builds the
# same bytes next month, and nothing on a friend's PC came from "whatever the
# CDN served today". SHA256SUMS and a build-provenance attestation ride along
# so anyone can check what they downloaded (no code-signing certificate:
# SmartScreen still warns once, the checksum and attestation are the proof).
name: agent-release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # Manual: re-release the latest green main (e.g. after a pruned release).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release
  cancel-in-progress: false

env:
  # https://www.gyan.dev/ffmpeg/builds/ - the versioned "full" build (NVENC
  # included), same as the owner's machines use. Bump both lines together;
  # the .sha256 next to the archive is where the checksum comes from.
  FFMPEG_VERSION: 9.0.1
  FFMPEG_SHA256: 4b9c814cb07a1f90d05b768ef4eb2abbf89af94bbb924df5b7dbd6e64e1e2b96
  INNOSETUP_VERSION: 6.7.1
  # What counts as "the agent" for the release decision.
  AGENT_PATHS: >-
    src/LeagueTracker.RenderAgent
    src/LeagueTracker.ReplayLauncher
    deploy/publish-agent.ps1
    deploy/agent-setup.iss
    deploy/screenrecorderlib
    .github/workflows/agent-release.yml

jobs:
  # Which commit, which ci run's artifact, and is there anything to release.
  gate:
    name: Release needed?
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      since: ${{ steps.decide.outputs.since }}
    steps:
      - name: Resolve the ci run to release from
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            $runId = '${{ github.event.workflow_run.id }}'
            $sha = '${{ github.event.workflow_run.head_sha }}'
          } else {
            $run = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci --branch main --status success --limit 1 --json databaseId,headSha | ConvertFrom-Json | Select-Object -First 1
            if (-not $run) { throw "no successful ci run on main to release from" }
            $runId = $run.databaseId
            $sha = $run.headSha
          }
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "ci run $runId at $sha"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compare with the last agent release
        id: decide
        shell: pwsh
        run: |
          $last = git tag --list 'agent-*' |
            ForEach-Object { [pscustomobject]@{ Tag = $_; Version = [Version]($_ -replace '^agent-', '') } } |
            Sort-Object Version -Descending | Select-Object -First 1
          $paths = $env:AGENT_PATHS -split '\s+' | Where-Object { $_ }
          if (-not $last) {
            $release = 'true'; $since = '(no previous agent release)'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $release = 'true'; $since = "$($last.Tag) (manual)"
          } else {
            git diff --quiet "$($last.Tag)" HEAD -- @paths
            $release = if ($LASTEXITCODE -ne 0) { 'true' } else { 'false' }
            $since = $last.Tag
          }
          "release=$release" >> $env:GITHUB_OUTPUT
          "since=$since" >> $env:GITHUB_OUTPUT
          if ($release -eq 'true') { Write-Host "agent files changed since $since - releasing" }
          else { Write-Host "no agent changes since $since - nothing to release" }
          # git diff --quiet's exit code 1 (= changes) is the answer, not a
          # failure; the pwsh shell would otherwise fail the step on it.
          exit 0

  publish:
    name: Build and release
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The WGC engine, as built and uploaded by ci's screenrecorderlib job
      # for this very commit.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenrecorderlib
          path: deploy/screenrecorderlib/out
          run-id: ${{ needs.gate.outputs.run_id }}
          github-token: ${{ github.token }}

      # publish-agent.ps1 bundles ffmpeg from PATH so a friend's PC needs
      # nothing else installed. Not choco: its ffmpeg on PATH is a shim that
      # only works on the machine it was installed on.
      - name: Fetch ffmpeg ${{ env.FFMPEG_VERSION }}
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$env:FFMPEG_VERSION-full_build.7z"
          Invoke-WebRequest $url -OutFile ffmpeg.7z
          $actual = (Get-FileHash ffmpeg.7z -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:FFMPEG_SHA256) { throw "ffmpeg checksum mismatch: expected $env:FFMPEG_SHA256, got $actual" }
          7z x ffmpeg.7z -offmpeg-dist | Out-Null
          $bin = (Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "$bin" >> $env:GITHUB_PATH
          & (Join-Path $bin ffmpeg.exe) -version | Select-Object -First 1

      - name: Install Inno Setup ${{ env.INNOSETUP_VERSION }}
        run: choco install innosetup --version ${{ env.INNOSETUP_VERSION }} --no-progress -y

      - name: Build zip and installer
        id: build
        shell: pwsh
        run: |
          .\deploy\publish-agent.ps1 -RequirePatchedRecorder
          $zip = Get-ChildItem src\LeagueTracker.RenderAgent\bin\LeagueTracker.RenderAgent-*.zip | Select-Object -First 1
          $version = $zip.BaseName -replace '^.*-', ''
          $setup = Get-ChildItem src\LeagueTracker.RenderAgent\bin\LeagueTracker.Agent-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw "installer missing" }

          # The zip must carry the ScreenRecorderLib ci built for this commit,
          # not the stock NuGet copy - byte for byte.
          $expected = (Get-FileHash deploy\screenrecorderlib\out\ScreenRecorderLib.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Expand-Archive $zip.FullName -DestinationPath zip-check -Force
          $shipped = (Get-FileHash zip-check\ScreenRecorderLib.dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($shipped -ne $expected) { throw "zip carries ScreenRecorderLib.dll $shipped, expected the ci build $expected" }
          if (-not (Test-Path zip-check\THIRD-PARTY-NOTICES.md)) { throw "zip is missing THIRD-PARTY-NOTICES.md" }

          $sums = Join-Path $zip.DirectoryName "SHA256SUMS.txt"
          @($zip, $setup) | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content $sums -Encoding ascii
          Get-Content $sums
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "setup=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "sums=$sums" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "recorder_sha=$expected" >> $env:GITHUB_OUTPUT

      # Signed statement (Sigstore, via GitHub OIDC) that these exact files
      # came from this workflow at this commit. Verify with:
      #   gh attestation verify <file> --repo r-alvarez/LeagueTracker
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.setup }}

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "agent-${{ steps.build.outputs.version }}" "${{ steps.build.outputs.zip }}" "${{ steps.build.outputs.setup }}" "${{ steps.build.outputs.sums }}" `
            --target "${{ needs.gate.outputs.sha }}" `
            --title "Agent ${{ steps.build.outputs.version }}" `
            --generate-notes `
            --notes "Render/recorder agent built from ${{ needs.gate.outputs.sha }} (ci run ${{ needs.gate.outputs.run_id }}, previous agent release: ${{ needs.gate.outputs.since }}). Setup.exe for new machines (per-user, no admin); the zip is what installed agents update themselves from. SHA256SUMS.txt lists both; provenance: ``gh attestation verify <file> --repo ${{ github.repository }}``. Bundled ScreenRecorderLib.dll (HDR tone-map build) sha256 ${{ steps.build.outputs.recorder_sha }}. Third-party licences: THIRD-PARTY-NOTICES.md in the zip."
